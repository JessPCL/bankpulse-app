# BANKPULSE - entorno local: SVC-BP-01 (bankpulse-api) + SVC-BP-02 (bankpulse-db)
name: bankpulse

services:
  bankpulse-db:
    image: postgres:16-alpine
    container_name: bankpulse-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-bankpulse}
      POSTGRES_USER: ${DB_USER:-bankpulse_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD en el archivo .env (copie .env.example)}
    volumes:
      - bankpulse_pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    # La base de datos NO se publica al host: solo la API la alcanza por la red interna de Compose.

  bankpulse-api:
    build: .
    container_name: bankpulse-api
    restart: unless-stopped
    ports:
      - "${API_PORT:-3001}:3000"
    environment:
      PORT: 3000
      DB_HOST: bankpulse-db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-bankpulse}
      DB_USER: ${DB_USER:-bankpulse_user}
      DB_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD en el archivo .env (copie .env.example)}
    depends_on:
      bankpulse-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  bankpulse_pgdata:
    name: bankpulse_pgdata
